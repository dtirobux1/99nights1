
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Landing Page — 99nighta & grow a garden</title>
  <style>
    body {
      margin:0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
      color:white;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border-radius:20px;
      padding:50px 30px;
      box-shadow:0 8px 30px rgba(0,0,0,0.5);
      text-align:center;
      max-width:400px;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      animation: fadeInUp 1s ease forwards;
    }
    h1 {
      margin:0 0 30px;
      font-size:26px;
      font-weight:700;
      color:#f1f5f9;
    }
    .btn {
      display:inline-block;
      margin:15px 0;
      padding:18px 25px;
      border-radius:14px;
      text-decoration:none;
      font-weight:700;
      font-size:20px;
      background:linear-gradient(90deg,#7c3aed,#06b6d4);
      color:white;
      width:220px;
      transition:0.4s ease;
      box-shadow:0 4px 14px rgba(0,0,0,0.4);
      opacity:0;
      transform:scale(0.8);
      animation: popIn 0.8s ease forwards;
    }
    .btn:nth-of-type(1) { animation-delay:0.1s; }
    .btn:nth-of-type(2) { animation-delay:0.4s; }
    .btn:hover {
      transform:scale(1.08);
      box-shadow:0 6px 22px rgba(0,0,0,0.6), 0 0 15px rgba(124,58,237,0.6);
    }
    .footer {
      margin-top:30px;
      font-size:13px;
      color:#94a3b8;
    }
    /* Animations */
    @keyframes fadeInUp {
      from {opacity:0; transform:translateY(40px);}
      to {opacity:1; transform:translateY(0);}
    }
    @keyframes popIn {
      0% {opacity:0; transform:scale(0.8);}
      100% {opacity:1; transform:scale(1);}
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <h1>Choose a Link</h1>
    <a href="https://growgardenn.site/" class="btn" target="_blank">99 nights in the forest</a>
    <a href="https://mrblox.xyz/" class="btn" target="_blank">grow a garden</a>
    <div class="footer">© 2025 All Rights Reserved</div>
  </div>
</body>
</html>
